name: Build CleanYourTV Launcher APK
on:
  workflow_dispatch: # ✅ 手动触发！你自己点按钮才编译
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK（只编译launcher！）
        working-directory: ./launcher
        run: ./gradlew assembleDebug

      - name: Upload APK （编译完可以下载）
        uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
